services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sqlserver-data:/var/opt/mssql

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  taskflow-api:
    build:
      context: ./backend
      dockerfile: src/TaskFlow.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=TaskFlow;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True"
      RabbitMq__HostName: rabbitmq
      Jwt__SecretKey: "local-dev-secret-key-change-me-1234567890"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  taskflow-notifications:
    build:
      context: ./backend
      dockerfile: src/TaskFlow.Notifications/Dockerfile
    ports:
      - "5081:8080"
    environment:
      Mongo__ConnectionString: "mongodb://mongo:27017"
      RabbitMq__HostName: rabbitmq
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  taskflow-web:
    build:
      context: ./frontend/taskflow-web
      args:
        VITE_API_URL: "http://localhost:5080"
        VITE_NOTIFICATIONS_URL: "http://localhost:5081"
    ports:
      - "5173:8080"
    depends_on:
      - taskflow-api
      - taskflow-notifications

volumes:
  sqlserver-data:
  mongo-data:
