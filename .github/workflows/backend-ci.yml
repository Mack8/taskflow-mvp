name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: BootstrapTest!12345
        ports:
          - 14339:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BootstrapTest!12345' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/TaskFlow.sln

      - name: Build
        run: dotnet build backend/TaskFlow.sln --configuration Release --no-restore

      - name: Test — Application (unit)
        run: >
          dotnet test backend/tests/TaskFlow.Application.Tests/TaskFlow.Application.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=application-tests.trx"
          --results-directory ./test-results

      - name: Test — Api (integration, in-memory DB)
        run: >
          dotnet test backend/tests/TaskFlow.Api.IntegrationTests/TaskFlow.Api.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=api-integration-tests.trx"
          --results-directory ./test-results

      - name: Test — Notifications (integration, real MongoDB)
        run: >
          dotnet test backend/tests/TaskFlow.Notifications.IntegrationTests/TaskFlow.Notifications.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=notifications-integration-tests.trx"
          --results-directory ./test-results

      - name: Test — Bootstrap (integration, real SQL Server)
        env:
          TEST_SQL_CONNECTION: Server=localhost,14339;User Id=sa;Password=BootstrapTest!12345;TrustServerCertificate=True
        run: >
          dotnet test backend/tests/TaskFlow.Bootstrap.IntegrationTests/TaskFlow.Bootstrap.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=bootstrap-integration-tests.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./test-results
