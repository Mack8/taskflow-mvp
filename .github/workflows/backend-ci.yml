name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/TaskFlow.sln

      - name: Build
        run: dotnet build backend/TaskFlow.sln --configuration Release --no-restore

      - name: Test — Application (unit)
        run: >
          dotnet test backend/tests/TaskFlow.Application.Tests/TaskFlow.Application.Tests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=application-tests.trx"
          --results-directory ./test-results

      - name: Test — Api (integration, in-memory DB)
        run: >
          dotnet test backend/tests/TaskFlow.Api.IntegrationTests/TaskFlow.Api.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=api-integration-tests.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./test-results
