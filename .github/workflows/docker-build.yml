name: Docker Build & Publish

# Validates every Dockerfile on every PR (catches broken images before merge)
# and, on main, pushes the same images to GHCR — the closest this MVP gets to
# a real CD step without an Azure subscription wired into CI secrets. Swapping
# the final push step for `az webapp` / `az containerapp` deploy commands is
# the only change needed to land this on the Azure topology in infra/bicep.
on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: taskflow-api
            context: ./backend
            dockerfile: ./backend/src/TaskFlow.Api/Dockerfile
          - image: taskflow-notifications
            context: ./backend
            dockerfile: ./backend/src/TaskFlow.Notifications/Dockerfile
          - image: taskflow-web
            context: ./frontend/taskflow-web
            dockerfile: ./frontend/taskflow-web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker image names must be lowercase, but github.repository preserves
      # the account's actual case (e.g. "Mack8/taskflow-mvp") — build-push-action
      # then rejects the tag outright ("repository name must be lowercase").
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (conditionally) push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
