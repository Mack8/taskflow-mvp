server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router owns client-side routes like /projects/:id,
    # which don't exist as files, so unmatched paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
